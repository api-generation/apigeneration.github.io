site_name: "API Generation Docs"
site_url: "https://apigeneration.tech/"
repo_url: "https://github.com/your-org/your-repo" # Update with actual repo

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    # Light Mode (Matches MTT Manager app background)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  features:
    - navigation.tabs          # Top horizontal navbar
    - navigation.sections      # Sidebar sections
    - navigation.top           # Back-to-top button
    - navigation.instant       # Fast SPA transitions
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/mtt-style.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Learn:
      - Overview: learn/mtt-overview/index.md
      - Projects: learn/projects/index.md
      - Models: learn/models/index.md
      - Loaders: learn/loaders/index.md
      - Standard Generators: learn/standard-generators/index.md
      - New Generators: learn/new-generators/index.md
      - Running MTT: learn/running-mtt/index.md
      - Example Projects: learn/example-projects/index.md
  - FAQ: faq/index.md
  - Try MTT: try-mtt/index.md
