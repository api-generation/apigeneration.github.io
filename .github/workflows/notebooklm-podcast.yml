name: Generate & Publish NotebookLM Audio Overview

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.md'

permissions:
  contents: write

jobs:
  update-podcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Update NotebookLM & Audio Artifact
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Syncing documentation updates to NotebookLM knowledge base..."
          # Python script interacts with NotebookLM sources to refresh content
          python scripts/update_podcast.py

      - name: Commit Updated Audio Asset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add docs/assets/podcast.mp3
          git diff-index --quiet HEAD || git commit -m "chore(podcast): update NotebookLM audio overview podcast [skip ci]"
          git push
